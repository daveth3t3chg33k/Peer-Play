name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peerplay
          POSTGRES_PASSWORD: peerplay_secret
          POSTGRES_DB: peerplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: peerplay
          DB_PASSWORD: peerplay_secret
          DB_NAME: peerplay_test
          DB_SSLMODE: disable
          JWT_SECRET: test-secret
        run: go test -v ./...

  build:
    name: Server - Build
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o peerplay-server ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: peerplay-server
          path: ./server/peerplay-server
