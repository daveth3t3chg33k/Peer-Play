version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: peerplay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: peerplay
      POSTGRES_PASSWORD: peerplay_secret
      POSTGRES_DB: peerplay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerplay -d peerplay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peerplay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: peerplay-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      APP_ENV: "development"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: peerplay
      DB_PASSWORD: peerplay_secret
      DB_NAME: peerplay
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: "dev-secret-change-in-production"
      JWT_EXPIRATION_HOURS: "72"
      DHT_PORT: "6881"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: ["go", "run", "./cmd/server"]

volumes:
  postgres_data:
  redis_data:
